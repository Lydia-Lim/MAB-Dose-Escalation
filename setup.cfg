[metadata]
name = pa-dose-escalation
version = 0.0.1
author = Jason Zhang
author_email = jason.zhang@ucb.com
description = Utility package for dose escalation study
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6

[options.packages.find]
where = src
